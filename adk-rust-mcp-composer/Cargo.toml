[package]
name = "adk-rust-mcp-composer"
description = "MCP server for composite media generation (GIFs, shorts, memes, presentations, podcasts)"
readme = "README.md"
documentation = "https://docs.rs/adk-rust-mcp-composer"
edition.workspace = true
version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true
rust-version.workspace = true

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[lib]
name = "adk_rust_mcp_composer"
path = "src/lib.rs"

[[bin]]
name = "adk-rust-mcp-composer"
path = "src/main.rs"

[dependencies]
adk-rust-mcp-common = { version = "0.4.0", path = "../adk-rust-mcp-common" }
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
anyhow.workspace = true
rmcp.workspace = true
reqwest.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
schemars.workspace = true
async-trait.workspace = true
base64.workspace = true
clap.workspace = true
uuid.workspace = true
tempfile = "3"

[dev-dependencies]
dotenvy.workspace = true
